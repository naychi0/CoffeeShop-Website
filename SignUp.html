<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="SignUp.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="signup-wrapper">
        <h1 class="main-title">Create an account</h1>
        
        <div class="signup-card">
            <p class="notice">* indicates required field</p>
            
            <form action="#">
                <div class="input-group">
                    <input type="text" id="firstName" required placeholder=" ">
                    <label for="firstName">* First name</label>
                </div>

                <div class="input-group">
                    <input type="text" id="lastName" required placeholder=" ">
                    <label for="lastName">* Last name</label>
                </div>

                <div class="input-group">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">* Email address</label>
                </div>

                <div class="input-group">
                    <input type="tel" id="phone" required placeholder=" ">
                    <label for="phone">* Phone number</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">* Password</label>
                </div>

                <div class="action-container">
                    <button type="submit" class="btn-submit">Create account</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
